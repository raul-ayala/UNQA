<script>
  // The glow layer sweeps ONE light around the largest contour only
  // (dash patterns restart per subpath, so a multi-subpath glow would fragment).
  function soloGlow(root){
    (root||document).querySelectorAll('.f-glow path').forEach(function(p){
      var full = p.getAttribute('data-full') || p.getAttribute('d');
      p.setAttribute('data-full', full);
      var subs = full.split('M').filter(Boolean).map(function(s){ return 'M' + s; });
      var best = subs.reduce(function(a, b){ return b.length > a.length ? b : a; }, subs[0]);
      p.setAttribute('d', best);
    });
  }
  function setLens(root){
    (root||document).querySelectorAll('svg path').forEach(function(p){
      var L = 0;
      try { L = p.getTotalLength(); } catch(e) { L = 6000; }
      p.style.setProperty('--len', Math.ceil(L));
    });
  }
  function wire(){
    document.querySelectorAll('.replay').forEach(function(b){
      b.onclick=function(){
        var f=document.getElementById(b.dataset.target);
        var clone=f.cloneNode(true);
        f.parentNode.replaceChild(clone,f);
        soloGlow(clone); setLens(clone); wire();
      };
    });
  }
  soloGlow(); setLens(); wire();
</script>
